<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>i drive chat</title>
<style>
* {
    box-sizing: border-box;
}
:root {
    --bg: #0d1110;
    --panel: #151b19;
    --panel2: #1b2421;
    --border: #29332f;
    --accent: #35c98b;
    --accent-dark: #24966a;
    --text: #f2f5f3;
    --muted: #8e9a95;
    --danger: #ff6b6b;
}
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}
button,
input {
    font: inherit;
}
button {
    cursor: pointer;
}
.hidden {
    display: none !important;
}
/* AUTH */
#authScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.authBox {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
}
.logo {
    text-align: center;
    font-size: 31px;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: -1px;
}
.logo span {
    color: var(--accent);
}
.subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 25px;
}
.tabs {
    display: flex;
    background: var(--bg);
    padding: 4px;
    border-radius: 12px;
    margin-bottom: 20px;
}
.tabs button {
    flex: 1;
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 11px;
    border-radius: 9px;
}
.tabs button.active {
    background: var(--panel2);
    color: var(--text);
}
.formGroup {
    margin-bottom: 14px;
}
.formGroup label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 7px;
}
input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 12px;
    padding: 13px 14px;
    outline: none;
}
input:focus {
    border-color: var(--accent);
}
.primaryBtn {
    width: 100%;
    border: 0;
    background: var(--accent);
    color: #07140e;
    font-weight: 700;
    padding: 13px;
    border-radius: 12px;
    margin-top: 5px;
}
.primaryBtn:hover {
    background: #42d99a;
}
.warning {
    margin-top: 18px;
    padding: 12px;
    border-radius: 10px;
    background: rgba(255,190,80,.08);
    border: 1px solid rgba(255,190,80,.2);
    color: #e8c77d;
    font-size: 13px;
    line-height: 1.45;
}
.error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 12px;
    line-height: 1.4;
}
.success {
    color: var(--accent);
    font-size: 13px;
    margin-top: 12px;
}
/* APP */
#app {
    min-height: 100vh;
    display: flex;
}
.sidebar {
    width: 350px;
    min-width: 300px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
}
.sidebarHeader {
    padding: 20px;
    border-bottom: 1px solid var(--border);
}
.appTitle {
    font-size: 23px;
    font-weight: 800;
}
.appTitle span {
    color: var(--accent);
}
.userMini {
    margin-top: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.userMiniInfo {
    min-width: 0;
}
.userMiniName {
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.userMiniUsername {
    color: var(--muted);
    font-size: 13px;
}
.smallBtn {
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    border-radius: 9px;
    padding: 8px 10px;
    font-size: 12px;
}
.searchBox {
    padding: 15px 20px;
    border-bottom: 1px solid var(--border);
}
.searchRow {
    display: flex;
    gap: 8px;
}
.searchRow input {
    min-width: 0;
}
.searchBtn {
    border: 0;
    background: var(--accent);
    color: #07140e;
    border-radius: 11px;
    padding: 0 15px;
    font-weight: 700;
}
.searchResult {
    margin-top: 10px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
}
.searchResultTop {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}
.searchResultName {
    font-weight: 700;
}
.searchResultUsername {
    color: var(--muted);
    font-size: 13px;
    margin-top: 2px;
}
.openChatBtn {
    border: 0;
    background: var(--accent);
    color: #07140e;
    border-radius: 9px;
    padding: 8px 11px;
    font-weight: 700;
    white-space: nowrap;
}
.contactsTitle {
    padding: 15px 20px 8px;
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .7px;
}
.contacts {
    flex: 1;
    overflow-y: auto;
}
.contact {
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255,255,255,.035);
    cursor: pointer;
}
.contact:hover,
.contact.active {
    background: var(--panel2);
}
.contactName {
    font-weight: 700;
}
.contactUsername {
    color: var(--muted);
    font-size: 13px;
    margin-top: 3px;
}
/* CHAT */
.chat {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}
.chatEmpty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    text-align: center;
    padding: 30px;
}
.chatHeader {
    min-height: 72px;
    padding: 15px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
}
.chatName {
    font-weight: 800;
}
.chatUsername {
    color: var(--muted);
    font-size: 13px;
    margin-top: 2px;
}
.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.message {
    max-width: min(75%, 600px);
    padding: 10px 13px;
    border-radius: 15px;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-wrap;
}
.message.mine {
    align-self: flex-end;
    background: var(--accent-dark);
    border-bottom-right-radius: 5px;
}
.message.theirs {
    align-self: flex-start;
    background: var(--panel2);
    border-bottom-left-radius: 5px;
}
.messageTime {
    font-size: 10px;
    opacity: .65;
    margin-top: 4px;
    text-align: right;
}
.messageForm {
    padding: 14px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 9px;
}
.messageForm input {
    flex: 1;
}
.sendBtn {
    border: 0;
    background: var(--accent);
    color: #07140e;
    border-radius: 11px;
    padding: 0 18px;
    font-weight: 800;
}
/* PROFILE */
.profilePanel {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 320px;
    max-width: calc(100vw - 40px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
    z-index: 20;
}
.profilePanel h3 {
    margin-top: 0;
}
.closeBtn {
    float: right;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 20px;
}
.logoutBtn {
    width: 100%;
    border: 1px solid rgba(255,107,107,.3);
    background: rgba(255,107,107,.08);
    color: #ff8b8b;
    padding: 11px;
    border-radius: 10px;
    margin-top: 10px;
}
/* MOBILE */
@media (max-width: 700px) {
    #app {
        display: block;
    }
    .sidebar {
        width: 100%;
        min-width: 0;
        height: 100vh;
    }
    .chat {
        display: none;
        height: 100vh;
    }
    #app.chat-open .sidebar {
        display: none;
    }
    #app.chat-open .chat {
        display: flex;
    }
    .mobileBack {
        display: block !important;
    }
}
.mobileBack {
    display: none;
    border: 0;
    background: transparent;
    color: var(--text);
    font-size: 23px;
    margin-right: 12px;
}
</style>
</head>
<body>

<div id="authScreen">
    <div class="authBox">
        <div class="logo">i drive <span>chat</span></div>
        <div class="subtitle">Простой личный мессенджер</div>

        <div class="tabs">
            <button id="loginTab" class="active">Вход</button>
            <button id="registerTab">Регистрация</button>
        </div>

        <form id="loginForm">
            <div class="formGroup">
                <label>Username</label>
                <input id="loginUsername"
                       type="text"
                       autocomplete="username"
                       placeholder="например vasya"
                       required>
            </div>

            <div class="formGroup">
                <label>Password</label>
                <input id="loginPassword"
                       type="password"
                       autocomplete="current-password"
                       placeholder="Ваш пароль"
                       required>
            </div>

            <button class="primaryBtn" type="submit">
                Войти
            </button>

            <div id="loginError" class="error"></div>

            <div class="warning">
                ⚠️ Сайт может часто выкидывать из аккаунта — запоминайте свои пароли.
            </div>
        </form>

        <form id="registerForm" class="hidden">
            <div class="formGroup">
                <label>Username</label>
                <input id="registerUsername"
                       type="text"
                       autocomplete="username"
                       placeholder="например vasya"
                       maxlength="30"
                       required>
            </div>

            <div class="formGroup">
                <label>Display Name</label>
                <input id="registerDisplayName"
                       type="text"
                       placeholder="Вася"
                       maxlength="50"
                       required>
            </div>

            <div class="formGroup">
                <label>Password</label>
                <input id="registerPassword"
                       type="password"
                       autocomplete="new-password"
                       placeholder="Минимум 6 символов"
                       minlength="6"
                       required>
            </div>

            <button class="primaryBtn" type="submit">
                Создать аккаунт
            </button>

            <div id="registerError" class="error"></div>
            <div id="registerSuccess" class="success"></div>
        </form>
    </div>
</div>

<div id="app" class="hidden">

    <aside class="sidebar">

        <div class="sidebarHeader">

            <div class="appTitle">
                i drive <span>chat</span>
            </div>

            <div class="userMini">

                <div class="userMiniInfo">
                    <div id="miniDisplayName" class="userMiniName"></div>
                    <div id="miniUsername" class="userMiniUsername"></div>
                </div>

                <button id="profileBtn" class="smallBtn">
                    Профиль
                </button>

            </div>

        </div>

        <div class="searchBox">

            <div class="searchRow">

                <input id="searchInput"
                       type="text"
                       placeholder="@username">

                <button id="searchBtn" class="searchBtn">
                    Найти
                </button>

            </div>

            <div id="searchResult"></div>

        </div>

        <div class="contactsTitle">
            Контакты
        </div>

        <div id="contactsList" class="contacts">
            <div style="padding:20px;color:#8e9a95;">
                Пока нет контактов.
            </div>
        </div>

    </aside>

    <main class="chat">

        <div id="chatEmpty" class="chatEmpty">
            <div>
                <div style="font-size:22px;margin-bottom:8px;">
                    💬
                </div>
                Найдите пользователя по username<br>
                и начните личный чат.
            </div>
        </div>

        <div id="chatContent" class="hidden" style="height:100%;display:flex;flex-direction:column;">

            <div class="chatHeader">

                <button id="mobileBack"
                        class="mobileBack">
                    ←
                </button>

                <div>
                    <div id="chatDisplayName" class="chatName"></div>
                    <div id="chatUsername" class="chatUsername"></div>
                </div>

            </div>

            <div id="messagesList" class="messages"></div>

            <form id="messageForm" class="messageForm">

                <input id="messageInput"
                       type="text"
                       maxlength="5000"
                       placeholder="Написать сообщение..."
                       autocomplete="off"
                       required>

                <button class="sendBtn" type="submit">
                    ➤
                </button>

            </form>

        </div>

    </main>

</div>

<div id="profilePanel" class="profilePanel hidden">

    <button id="closeProfile" class="closeBtn">
        ×
    </button>

    <h3>Профиль</h3>

    <div style="color:#8e9a95;font-size:13px;">
        Username
    </div>

    <div id="profileUsername"
         style="font-weight:700;margin:5px 0 18px;">
    </div>

    <div class="formGroup">

        <label>Display Name</label>

        <input id="displayNameInput"
               maxlength="50">

    </div>

    <button id="saveDisplayName"
            class="primaryBtn">
        Сохранить
    </button>

    <div id="profileMessage"></div>

    <button id="logoutBtn"
            class="logoutBtn">
        Выйти из аккаунта
    </button>

</div>

<script type="module">

import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    setPersistence,
    browserLocalPersistence,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut,
    deleteUser,
    updateProfile
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    getDatabase,
    ref,
    get,
    set,
    update,
    push,
    onValue
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


const firebaseConfig = {
    apiKey: "AIzaSyAoAUsGJl4ubZ3biN2lUdf4B_2rpIdR3bU",
    authDomain: "i-drive-chat-36c5c.firebaseapp.com",
    databaseURL: "https://i-drive-chat-36c5c-default-rtdb.firebaseio.com",
    projectId: "i-drive-chat-36c5c",
    storageBucket: "i-drive-chat-36c5c.firebasestorage.app",
    messagingSenderId: "166609002779",
    appId: "1:166609002779:web:91651362e588ff3b09f3be",
    measurementId: "G-QBVLL2BKW8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

await setPersistence(auth, browserLocalPersistence);

const authScreen = document.getElementById("authScreen");
const appScreen = document.getElementById("app");

const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");

const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");

const loginError = document.getElementById("loginError");
const registerError = document.getElementById("registerError");
const registerSuccess = document.getElementById("registerSuccess");

const contactsList = document.getElementById("contactsList");

const searchInput = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const searchResult = document.getElementById("searchResult");

const chatEmpty = document.getElementById("chatEmpty");
const chatContent = document.getElementById("chatContent");
const messagesList = document.getElementById("messagesList");

const messageForm = document.getElementById("messageForm");
const messageInput = document.getElementById("messageInput");

const profilePanel = document.getElementById("profilePanel");

let currentUser = null;
let currentProfile = null;
let currentChatUser = null;
let currentMessagesUnsubscribe = null;
let contactsUnsubscribe = null;

function normalizeUsername(username) {
    return username
        .trim()
        .toLowerCase()
        .replace(/^@/, "");
}

function usernameIsValid(username) {
    return /^[a-z0-9_]{3,30}$/.test(username);
}

function technicalEmail(username) {
    return normalizeUsername(username) + "@idrivechat.local";
}

function chatPath(a, b) {
    const first = a < b ? a : b;
    const second = a < b ? b : a;
    return "messages/" + first + "/" + second;
}

function escapeHTML(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function showError(element, error) {

    console.error(error);

    let message = "Произошла ошибка.";

    if (error?.code) {

        const known = {
            "auth/email-already-in-use":
                "Этот username уже используется.",

            "auth/invalid-credential":
                "Неверный username или пароль.",

            "auth/invalid-email":
                "Некорректный username.",

            "auth/weak-password":
                "Пароль должен содержать минимум 6 символов.",

            "auth/network-request-failed":
                "Ошибка сети. Проверьте интернет.",

            "auth/too-many-requests":
                "Слишком много попыток. Попробуйте позже.",

            "PERMISSION_DENIED":
                "Firebase Realtime Database отклонила запрос. Нужно проверить Firebase Rules."
        };

        if (known[error.code]) {
            message = known[error.code];
        } else {
            message = error.message || message;
        }
    }

    element.textContent = message;
}

loginTab.addEventListener("click", () => {

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

    loginForm.classList.remove("hidden");
    registerForm.classList.add("hidden");

    loginError.textContent = "";
});

registerTab.addEventListener("click", () => {

    registerTab.classList.add("active");
    loginTab.classList.remove("active");

    registerForm.classList.remove("hidden");
    loginForm.classList.add("hidden");

    registerError.textContent = "";
});

registerForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    registerError.textContent = "";
    registerSuccess.textContent = "";

    const username =
        normalizeUsername(
            document.getElementById("registerUsername").value
        );

    const displayName =
        document.getElementById("registerDisplayName")
            .value
            .trim();

    const password =
        document.getElementById("registerPassword").value;

    if (!usernameIsValid(username)) {

        registerError.textContent =
            "Username: только английские буквы, цифры и _, от 3 до 30 символов.";

        return;
    }

    if (!displayName) {

        registerError.textContent =
            "Введите Display Name.";

        return;
    }

    if (password.length < 6) {

        registerError.textContent =
            "Пароль должен содержать минимум 6 символов.";

        return;
    }

    let createdUser = null;

    try {

        const credential =
            await createUserWithEmailAndPassword(
                auth,
                technicalEmail(username),
                password
            );

        createdUser = credential.user;

        await updateProfile(createdUser, {
            displayName: displayName
        });

        const profile = {

            uid: createdUser.uid,

            username: username,

            displayName: displayName,

            createdAt: Date.now()

        };

        await update(ref(db), {

            ["usernames/" + username]: createdUser.uid,

            ["profiles/" + createdUser.uid]: profile

        });

        registerSuccess.textContent =
            "Аккаунт создан. Входим...";

    } catch (error) {

        if (createdUser) {

            try {
                await deleteUser(createdUser);
            } catch (deleteError) {
                console.error(
                    "Не удалось удалить незавершённый Auth аккаунт:",
                    deleteError
                );
            }
        }

        showError(registerError, error);

        return;
    }

});

loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    loginError.textContent = "";

    const username =
        normalizeUsername(
            document.getElementById("loginUsername").value
        );

    const password =
        document.getElementById("loginPassword").value;

    if (!usernameIsValid(username)) {

        loginError.textContent =
            "Введите правильный username.";

        return;
    }

    try {

        await signInWithEmailAndPassword(
            auth,
            technicalEmail(username),
            password
        );

    } catch (error) {

        showError(loginError, error);
    }

});

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        currentUser = null;
        currentProfile = null;

        authScreen.classList.remove("hidden");
        appScreen.classList.add("hidden");

        if (contactsUnsubscribe) {
            contactsUnsubscribe();
            contactsUnsubscribe = null;
        }

        if (currentMessagesUnsubscribe) {
            currentMessagesUnsubscribe();
            currentMessagesUnsubscribe = null;
        }

        return;
    }

    currentUser = user;

    try {

        const profileSnapshot =
            await get(
                ref(db, "profiles/" + user.uid)
            );

        if (!profileSnapshot.exists()) {

            await signOut(auth);

            alert(
                "Профиль пользователя не найден в Firebase Database."
            );

            return;
        }

        currentProfile =
            profileSnapshot.val();

        authScreen.classList.add("hidden");
        appScreen.classList.remove("hidden");

        document.getElementById("miniDisplayName")
            .textContent =
            currentProfile.displayName;

        document.getElementById("miniUsername")
            .textContent =
            "@" + currentProfile.username;

        document.getElementById("profileUsername")
            .textContent =
            "@" + currentProfile.username;

        document.getElementById("displayNameInput")
            .value =
            currentProfile.displayName;

        loadContacts();

    } catch (error) {

        console.error(
            "Ошибка загрузки профиля:",
            error
        );

        alert(
            "Не удалось загрузить профиль. Открой консоль браузера для подробностей."
        );
    }

});

searchBtn.addEventListener("click", searchUser);

searchInput.addEventListener("keydown", (event) => {

    if (event.key === "Enter") {

        event.preventDefault();

        searchUser();
    }

});

async function searchUser() {

    searchResult.innerHTML = "";

    if (!currentUser) {
        return;
    }

    const username =
        normalizeUsername(searchInput.value);

    if (!usernameIsValid(username)) {

        searchResult.innerHTML =
            '<div style="color:#ff6b6b;font-size:13px;">' +
            'Введите username от 3 символов: например vasya' +
            '</div>';

        return;
    }

    try {

        const usernameSnapshot =
            await get(
                ref(db, "usernames/" + username)
            );

        if (!usernameSnapshot.exists()) {

            searchResult.innerHTML =
                '<div style="color:#8e9a95;font-size:13px;">' +
                'Пользователь не найден.' +
                '</div>';

            return;
        }

        const uid =
            usernameSnapshot.val();

        const profileSnapshot =
            await get(
                ref(db, "profiles/" + uid)
            );

        if (!profileSnapshot.exists()) {

            searchResult.innerHTML =
                '<div style="color:#ff6b6b;font-size:13px;">' +
                'Профиль пользователя не найден.' +
                '</div>';

            return;
        }

        const profile =
            profileSnapshot.val();

        if (profile.uid === currentUser.uid) {

            searchResult.innerHTML =
                '<div style="color:#8e9a95;font-size:13px;">' +
                'Это ваш собственный профиль.' +
                '</div>';

            return;
        }

        searchResult.innerHTML = `

            <div class="searchResultTop">

                <div>
                    <div class="searchResultName">
                        ${escapeHTML(profile.displayName)}
                    </div>

                    <div class="searchResultUsername">
                        @${escapeHTML(profile.username)}
                    </div>
                </div>

                <button class="openChatBtn" id="openSearchChat">
                    Написать
                </button>

            </div>
        `;

        document
            .getElementById("openSearchChat")
            .addEventListener("click", () => {

                openChat(profile);

            });

    } catch (error) {

        showError(searchResult, error);

    }

}

function loadContacts() {

    if (contactsUnsubscribe) {
        contactsUnsubscribe();
    }

    const contactsRef =
        ref(
            db,
            "contacts/" + currentUser.uid
        );

    contactsUnsubscribe =
        onValue(
            contactsRef,
            async (snapshot) => {

                contactsList.innerHTML = "";

                if (!snapshot.exists()) {

                    contactsList.innerHTML =
                        '<div style="padding:20px;color:#8e9a95;">' +
                        'Пока нет контактов.' +
                        '</div>';

                    return;
                }

                const contacts =
                    snapshot.val();

                const entries =
                    Object.entries(contacts);

                entries.sort(
                    (a, b) =>
                        (b[1].createdAt || 0) -
                        (a[1].createdAt || 0)
                );

                for (const [otherUid, contactData] of entries) {

                    try {

                        const profileSnapshot =
                            await get(
                                ref(
                                    db,
                                    "profiles/" + otherUid
                                )
                            );

                        if (!profileSnapshot.exists()) {
                            continue;
                        }

                        const profile =
                            profileSnapshot.val();

                        const element =
                            document.createElement("div");

                        element.className =
                            "contact";

                        if (
                            currentChatUser &&
                            currentChatUser.uid === otherUid
                        ) {
                            element.classList.add("active");
                        }

                        element.innerHTML = `

                            <div class="contactName">
                                ${escapeHTML(profile.displayName)}
                            </div>

                            <div class="contactUsername">
                                @${escapeHTML(profile.username)}
                            </div>
                        `;

                        element.addEventListener(
                            "click",
                            () => openChat(profile)
                        );

                        contactsList.appendChild(element);

                    } catch (error) {

                        console.error(
                            "Ошибка загрузки контакта:",
                            error
                        );

                    }

                }

            }
        );

}

async function addContact(otherUid) {

    if (!currentUser || !otherUid) {
        return;
    }

    await set(
        ref(
            db,
            "contacts/" +
            currentUser.uid +
            "/" +
            otherUid
        ),
        {
            otherUid: otherUid,
            createdAt: Date.now()
        }
    );

}

async function openChat(profile) {

    if (!currentUser) {
        return;
    }

    if (profile.uid === currentUser.uid) {
        return;
    }

    currentChatUser = profile;

    try {

        await addContact(profile.uid);

    } catch (error) {

        console.error(
            "Не удалось создать контакт:",
            error
        );

    }

    document.getElementById("chatDisplayName")
        .textContent =
        profile.displayName;

    document.getElementById("chatUsername")
        .textContent =
        "@" + profile.username;

    chatEmpty.classList.add("hidden");
    chatContent.classList.remove("hidden");

    document.getElementById("app")
        .classList.add("chat-open");

    loadMessages(profile.uid);

}

function loadMessages(otherUid) {

    if (currentMessagesUnsubscribe) {

        currentMessagesUnsubscribe();

        currentMessagesUnsubscribe = null;
    }

    messagesList.innerHTML = "";

    const path =
        chatPath(
            currentUser.uid,
            otherUid
        );

    const messagesRef =
        ref(db, path);

    currentMessagesUnsubscribe =
        onValue(
            messagesRef,
            (snapshot) => {

                messagesList.innerHTML = "";

                if (!snapshot.exists()) {

                    return;
                }

                const messages =
                    snapshot.val();

                const array =
                    Object.entries(messages)
                        .map(([id, message]) => ({
                            id,
                            ...message
                        }))
                        .sort(
                            (a, b) =>
                                (a.createdAt || 0) -
                                (b.createdAt || 0)
                        );

                for (const message of array) {

                    const element =
                        document.createElement("div");

                    element.className =
                        "message " +
                        (
                            message.senderId === currentUser.uid
                                ? "mine"
                                : "theirs"
                        );

                    const date =
                        message.createdAt
                            ? new Date(message.createdAt)
                            : new Date();

                    element.innerHTML = `

                        <div>
                            ${escapeHTML(message.body || "")}
                        </div>

                        <div class="messageTime">
                            ${date.toLocaleTimeString([], {
                                hour: "2-digit",
                                minute: "2-digit"
                            })}
                        </div>
                    `;

                    messagesList.appendChild(element);
                }

                messagesList.scrollTop =
                    messagesList.scrollHeight;

            }
        );

}

messageForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        if (!currentUser || !currentChatUser) {
            return;
        }

        const body =
            messageInput.value.trim();

        if (!body) {
            return;
        }

        if (body.length > 5000) {

            alert(
                "Сообщение слишком длинное."
            );

            return;
        }

        const path =
            chatPath(
                currentUser.uid,
                currentChatUser.uid
            );

        try {

            const messagesRef =
                ref(db, path);

            const newMessageRef =
                push(messagesRef);

            await set(
                newMessageRef,
                {

                    senderId:
                        currentUser.uid,

                    receiverId:
                        currentChatUser.uid,

                    body:
                        body,

                    createdAt:
                        Date.now()

                }
            );

            await addContact(
                currentChatUser.uid
            );

            messageInput.value = "";

        } catch (error) {

            /* =================================================
               ИЗМЕНЁН ТОЛЬКО ЭТОТ КУСОК
               ================================================= */

            console.error(
                "ОШИБКА ОТПРАВКИ:",
                error
            );

            alert(
                "ОШИБКА FIREBASE:\n\n" +
                "Код: " +
                (error.code || "нет") +
                "\n\nСообщение:\n" +
                (error.message || error)
            );

        }

    }
);

document
    .getElementById("mobileBack")
    .addEventListener("click", () => {

        document
            .getElementById("app")
            .classList.remove("chat-open");

        currentChatUser = null;

        if (currentMessagesUnsubscribe) {

            currentMessagesUnsubscribe();

            currentMessagesUnsubscribe = null;
        }

    });

document
    .getElementById("profileBtn")
    .addEventListener("click", () => {

        profilePanel.classList.remove("hidden");

    });

document
    .getElementById("closeProfile")
    .addEventListener("click", () => {

        profilePanel.classList.add("hidden");

    });

document
    .getElementById("saveDisplayName")
    .addEventListener("click", async () => {

        const newName =
            document
                .getElementById("displayNameInput")
                .value
                .trim();

        const profileMessage =
            document.getElementById(
                "profileMessage"
            );

        profileMessage.textContent = "";

        if (!newName) {

            profileMessage.innerHTML =
                '<div class="error">Введите Display Name.</div>';

            return;
        }

        try {

            await updateProfile(
                currentUser,
                {
                    displayName: newName
                }
            );

            await update(
                ref(
                    db,
                    "profiles/" + currentUser.uid
                ),
                {
                    displayName: newName
                }
            );

            currentProfile.displayName =
                newName;

            document.getElementById(
                "miniDisplayName"
            ).textContent =
                newName;

            profileMessage.innerHTML =
                '<div class="success">Сохранено.</div>';

        } catch (error) {

            console.error(error);

            profileMessage.innerHTML =
                '<div class="error">' +
                escapeHTML(
                    error.message ||
                    "Не удалось сохранить."
                ) +
                '</div>';

        }

    });

document
    .getElementById("logoutBtn")
    .addEventListener("click", async () => {

        try {

            await signOut(auth);

            profilePanel.classList.add("hidden");

        } catch (error) {

            console.error(
                "Ошибка выхода:",
                error
            );

        }

    });

</script>
